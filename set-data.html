<!DOCTYPE html>
<html>
    <head>
        <title>
            Set Data
        </title>
        <script src="jquery-4.0.0.min.js"></script>
        <script>
            function setData(){
                $("#txtUsername").val("admin")
                $("#txtPassword").val("password")
                $("#divResult").html("<h1>Welcome To CodeMines Computer</h1>")
                $("#pResult").text("<h1>Welcome To CodeMines Computer</h1>")
            }
        </script>
    </head>
    <body>
        <table>
            <tr>
                <td>
                    Username:
                </td>
                <td>
                    <input type="text" id="txtUsername"/>
                </td>
            </tr>
            <tr>
                <td>
                    Password:
                </td>
                <td>
                    <input type="text" id="txtPassword"/>
                </td>
            </tr>
            <tr>
                <td>
                    
                </td>
                <td>
                    <input type="button" value="Submit" onclick="setData()"/>
                </td>
            </tr>
        </table>
        <div id="divResult"></div>
        <p id="pResult"></p>
    </body>
</html>
