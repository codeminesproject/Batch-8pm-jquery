<!DOCTYPE html>
<html>
    <head>
        <title>
            Events
        </title>
        <script src="../jquery-4.0.0.min.js"></script>
        <script>
            $(document).ready(function(){
                $("#btnSubmit").click(function(){
                    alert("click event called")
                })
            })
        </script>
    </head>
    <body>
        <input type="button" value="Submit" id="btnSubmit"/>
    </body>
</html>
