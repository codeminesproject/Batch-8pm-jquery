<html>

<head>
    <title>DOM Manupulation</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        .h2 {
            font-size: 50px;
            color: white;
            background-color: blue;
        }

        .content-p {
            background-color: red;
            font-size: 30px;
            width: 300px;
            height: 200px;
        }

        .content-bold {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div id="content" class="content-p">
        
    </div>

    <input type="button" value="Hide Div" id="divHide" />
</body>
<script>
    $(document).ready(function(){
        $("#divHide").click(function(){
            $("#content").hide();
        })
    })
</script>

</html>
