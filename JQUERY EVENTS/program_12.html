<html>

<head>
    <title>DOM Manupulation</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        

        .content-p {
            background-color: red;
            font-size: 30px;
            width: 300px;
            height: 200px;
        }

        .div-hide {
            display: none;
        }
    </style>
</head>

<body>
    <div id="content">
        
    </div>

    <input type="button" value="ADD ATTRBUTE" id="divAttr" />
    <input type="button" value="Remove ATTRBUTE" id="divRemoveAttr" />
</body>
<script>
    $(document).ready(function(){
        

        $("#divAttr").click(function(){
            $("#content").attr("class","content-p")
        })

        $("#divRemoveAttr").click(function(){
            $("#content").removeAttr("class")
        })
    })
</script>

</html>
